name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay_password
          POSTGRES_DB: relay_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://relay:relay_password@localhost:5432/relay_engine?schema=public
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run db:deploy
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org
