services:
  postgres:
    image: postgres:16
    container_name: relay_engine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_password
      POSTGRES_DB: relay_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
